name: test

on:
  - push

jobs:
  build:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [^10.0, ^11.0, ^12.0, ^13.0]
        os: [ubuntu-latest]
        exclude:
          - laravel: ^13.0
            php: '8.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install Dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" --no-update
          composer update --prefer-dist --no-progress

      - name: Run PHP Spec
        run: ./vendor/bin/phpspec run -c phpspec.yml
